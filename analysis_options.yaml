include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - example/build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # `required SettingStore<T> store` assigned to a private `_store` field
    # is deliberate — it keeps the public parameter name clean instead of
    # exposing a leading-underscore named argument at call sites.
    prefer_initializing_formals: false
    # Dart 3.13's `new()` constructor syntax is very new; conventional
    # `ClassName()` constructors stay the idiomatic, widely-recognized
    # style for a published package.
    unnecessary_type_name_in_constructor: false
